
# Name of the workflow
name: ReactNewApp CI Pipeline

# Start workflow whenever code is pushed
on:
  push:
    branches:
      - main

# Permission to read repository files
permissions:
  contents: read

# Define the automation job
jobs:

  build:

    # GitHub virtual machine
    runs-on: ubuntu-latest

    # Tasks to execute
    steps:

      # Step 1: Download source code
      - name: Checkout Code
        uses: actions/checkout@v7

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Execute automated tests
      - name: Run Automated Tests
        run: npm test

      # Step 5: Build React application
      - name: Build React Application
        run: npm run build
